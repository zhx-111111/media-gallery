name = "media-gallery-worker"
main = "src/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库绑定（存储元数据）
[[d1_databases]]
binding = "DB"
database_name = "media_gallery_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# KV 命名空间 #1：存储管理员会话 / 缓存
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_YOUR_KV_CACHE_ID"

# KV 命名空间 #2：存储图片二进制（单值 ≤25MB，写后最终一致）
[[kv_namespaces]]
binding = "MEDIA_KV"
id = "REPLACE_WITH_YOUR_KV_MEDIA_ID"

[observability]
enabled = true

[vars]
# 管理员密码（请修改为强密码）
ADMIN_PASSWORD = "change-me-to-a-strong-password"
# 站点名称
SITE_NAME = "我的媒体画廊"
# 每页展示数量
PAGE_SIZE = "24"
# 单文件大小上限（字节），默认 24MB，留 1MB 余量给 KV metadata
MAX_FILE_SIZE = "25165824"
