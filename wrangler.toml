# ============================================================
#  Media Gallery — Cloudflare Workers
#  参考 cloudmail 架构：纯注释模板 + 控制台绑定
#
#  【零配置部署流程（全程网页操作，无需命令行）】
#
#  第 1 步：CF 控制台 → Workers & Pages → 连接 GitHub → 选本仓库
#            → 构建命令留空 → 保存并部署
#
#  第 2 步：CF 控制台 → 存储和数据库 → D1 SQL 数据库 → 创建
#            → 名称填 media_gallery_db → 创建后复制 database_id
#
#  第 3 步：CF 控制台 → 存储和数据库 → KV → 创建命名空间 ×2
#            → 名称分别填：media_kv 和 media_cache
#            → 分别复制两个命名空间 ID
#
#  第 4 步：回到 Worker → Settings → Bindings → 添加绑定：
#            → D1 绑定名填 db（不可改）→ 选 media_gallery_db
#            → KV 绑定名填 kv（不可改）→ 选 media_kv
#            → KV 绑定名填 cache（不可改）→ 选 media_cache
#            → 保存
#
#  第 5 步：Settings → Variables → 添加环境变量：
#            → INIT_SECRET = 任意一串随机字符串（初始化密钥，必填！）
#            → ADMIN_PASSWORD = 后台登录密码（可选，默认用 INIT_SECRET）
#            → 保存后访问 https://你的域名/api/init/你的INIT_SECRET
#            → 看到 {"ok":true,...} 即全部完成 ✅
#
#  第 6 步（可选）：Settings → Custom Domains → 添加自定义域名
# ============================================================

name = "media-gallery"
main = "src/worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# ── D1 数据库（取消注释并填入 ID，或在控制台绑定）──────────
# 绑定名 db 不可修改（代码里写死了 env.db）
# [[d1_databases]]
# binding = "db"
# database_name = "media_gallery_db"
# database_id = "在此填入 D1 的 database_id"

# ── KV 命名空间 ×2（取消注释并填入 ID，或在控制台绑定）──
# 绑定名 kv 和 cache 不可修改（代码里写死了）
# [[kv_namespaces]]
# binding = "kv"
# id = "在此填入 media_kv 的命名空间 ID"

# [[kv_namespaces]]
# binding = "cache"
# id = "在此填入 media_cache 的命名空间 ID"

# ── 环境变量（推荐在 CF 控制台 → Settings → Variables 里设置）
#    这样不用每次部署都改 wrangler.toml
# ── 必填：INIT_SECRET（初始化密钥，也是首次管理员密码）
# ── 选填：ADMIN_PASSWORD / PAGE_SIZE / MAX_FILE_SIZE / DEFAULT_BRAND
# ── 以下为默认值，控制台不设置就用这些 ──────────────────
[vars]
INIT_SECRET    = "please-change-me-to-a-random-string"
ADMIN_PASSWORD = ""
PAGE_SIZE      = "24"
MAX_FILE_SIZE  = "25165824"
DEFAULT_BRAND  = "Gallery"

# ── 自动部署（GitHub 推送后自动触发）──────────────────────
[triggers]
# 暂无定时任务，预留
