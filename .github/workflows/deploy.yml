name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Apply migrations & deploy Worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply media_gallery_db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DB_ID:             ${{ secrets.D1_DB_ID }}
          KV_CACHE_ID:          ${{ secrets.KV_CACHE_ID }}
          KV_MEDIA_ID:          ${{ secrets.KV_MEDIA_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DB_ID:             ${{ secrets.D1_DB_ID }}
          KV_CACHE_ID:          ${{ secrets.KV_CACHE_ID }}
          KV_MEDIA_ID:          ${{ secrets.KV_MEDIA_ID }}
