name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Apply migrations & deploy Worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install --legacy-peer-deps

      # 关键：先把 ${VAR} 替换成真实 Secret 值
      - name: Render wrangler.toml with real IDs
        run: node scripts/render-wrangler.mjs wrangler.toml
        env:
          D1_DB_ID:    ${{ secrets.D1_DB_ID }}
          KV_CACHE_ID: ${{ secrets.KV_CACHE_ID }}
          KV_MEDIA_ID: ${{ secrets.KV_MEDIA_ID }}

      - name: Show rendered toml (sanitized)
        run: sed -E 's/(database_id|id) = "[^"]*"/\1 = "***"/g' wrangler.toml

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply media_gallery_db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
