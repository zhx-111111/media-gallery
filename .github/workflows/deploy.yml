name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Apply migrations & deploy Worker
    steps:
      - uses: actions/checkout@v4

      - name: Download wrangler binary (no npm)
        run: |
          set -e
          # 直接下载官方发布的 wrangler 单文件二进制（无需 npm install）
          WRANGER_VERSION="4.86.0"
          URL="https://github.com/cloudflare/workers-sdk/releases/download/wrangler@${WRANGER_VERSION}/wrangler-linux-x64.tar.gz"
          echo "Downloading wrangler ${WRANGER_VERSION}..."
          curl -fSL "$URL" -o wrangler.tar.gz || {
            echo "❌ 主地址失败，尝试备选..."
            curl -fSL "https://registry.npmjs.org/wrangler/-/wrangler-${WRANGER_VERSION}.tgz" -o wrangler.tgz
            tar -xzf wrangler.tgz --strip-components=2 package/bin/wrangler
            chmod +x wrangler
            exit 0
          }
          tar -xzf wrangler.tar.gz
          chmod +x wrangler
          ./wrangler --version

      - name: Inject real IDs into wrangler.toml
        run: |
          set -e
          cp wrangler.toml wrangler.toml.bak
          sed -i "s|__D1_DB_ID__|${{ secrets.D1_DB_ID }}|g"        wrangler.toml
          sed -i "s|__KV_CACHE_ID__|${{ secrets.KV_CACHE_ID }}|g"  wrangler.toml
          sed -i "s|__KV_MEDIA_ID__|${{ secrets.KV_MEDIA_ID }}|g"  wrangler.toml
          echo "=== 替换后（脱敏）==="
          sed -E 's/(database_id|id) = "[^"]*"/\1 = "***"/g' wrangler.toml
          echo "=== 检查残留占位符 ==="
          grep -n "__.*__" wrangler.toml && echo "❌ 有残留" || echo "✅ 全部替换"

      - name: Wrangler whoami
        run: ./wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations (remote)
        run: ./wrangler d1 migrations apply media_gallery_db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: ./wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
