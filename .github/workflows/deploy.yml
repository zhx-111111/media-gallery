name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Apply migrations & deploy Worker
    container: node:20-bookworm
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: |
          set -e
          node -v && npm -v
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set registry https://registry.npmmirror.com
          npm install --no-audit --no-fund wrangler@4.86.0
          npx wrangler --version

      - name: Debug secrets (sanitized)
        run: |
          echo "D1_DB_ID    len=${#D1_DB_ID}    prefix=${D1_DB_ID:0:4}..."
          echo "KV_CACHE_ID len=${#KV_CACHE_ID} prefix=${KV_CACHE_ID:0:4}..."
          echo "KV_MEDIA_ID len=${#KV_MEDIA_ID} prefix=${KV_MEDIA_ID:0:4}..."
          echo "TOKEN       len=${#CLOUDFLARE_API_TOKEN} prefix=${CLOUDFLARE_API_TOKEN:0:4}..."
        env:
          D1_DB_ID:    ${{ secrets.D1_DB_ID }}
          KV_CACHE_ID: ${{ secrets.KV_CACHE_ID }}
          KV_MEDIA_ID: ${{ secrets.KV_MEDIA_ID }}

      - name: Inject real IDs into wrangler.toml
        run: |
          set -e
          echo "=== 替换前 ==="
          cat wrangler.toml
          echo "=== 开始替换 ==="
          sed -i "s|__D1_DB_ID__|${{ secrets.D1_DB_ID }}|g"        wrangler.toml
          sed -i "s|__KV_CACHE_ID__|${{ secrets.KV_CACHE_ID }}|g"  wrangler.toml
          sed -i "s|__KV_MEDIA_ID__|${{ secrets.KV_MEDIA_ID }}|g"  wrangler.toml
          echo "=== 替换后（脱敏）==="
          sed -E 's/(database_id|id) = "[^"]*"/\1 = "***"/g' wrangler.toml
          echo "=== 检查是否还有占位符 ==="
          grep -n "__.*__" wrangler.toml && echo "❌ 还有未替换占位符" || echo "✅ 全部替换完成"
        env:
          D1_DB_ID:    ${{ secrets.D1_DB_ID }}
          KV_CACHE_ID: ${{ secrets.KV_CACHE_ID }}
          KV_MEDIA_ID: ${{ secrets.KV_MEDIA_ID }}

      - name: Wrangler whoami
        run: npx wrangler whoami

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply media_gallery_db --remote

      - name: Deploy Worker
        run: npx wrangler deploy --env production
